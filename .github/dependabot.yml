version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    vendor: true
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "github.com/olekukonko/tablewriter"
        update-types: ["version-update:semver-major"]
      # aws-sdk-go-v2 service modules pinned to their last release WITHOUT a `schemas`
      # package. Newer releases link a schemas init() that can't be dead-code-eliminated
      # (~+14 MB binary, +30 ms startup): https://github.com/aws/aws-sdk-go-v2/issues/3601
      # To unpin: see CONTRIBUTING.md "Pinned aws-sdk-go-v2 service modules" (remove the
      # entry here and the module from the pin table once upstream fixes the issue).
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/accessanalyzer"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/account"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/acm"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/amplify"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/apigateway"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/apigatewayv2"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/appsync"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/athena"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/backup"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/batch"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/cloudtrail"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/cloudwatch"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/cloudwatchlogs"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/codebuild"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/codecommit"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/codedeploy"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/codepipeline"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/cognitoidentity"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/cognitoidentityprovider"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/configservice"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/directconnect"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/dynamodb"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ecr"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ecs"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/efs"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/eks"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/elasticloadbalancingv2"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/emr"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/eventbridge"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/glacier"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/glue"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/guardduty"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/iot"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ivs"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ivschat"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ivsrealtime"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/kinesis"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/kms"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/lambda"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/mediaconvert"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/opensearch"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/organizations"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/rekognition"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/resourcegroupstaggingapi"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/sagemaker"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/secretsmanager"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/securityhub"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/sfn"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/sqs"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/ssm"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/transcribe"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/waf"
      - dependency-name: "github.com/aws/aws-sdk-go-v2/service/wafv2"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
