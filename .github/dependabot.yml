version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    vendor: true
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Manual migration planned; do not auto-bump majors.
      - dependency-name: "github.com/aws/aws-sdk-go"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github.com/olekukonko/tablewriter"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
