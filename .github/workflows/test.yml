# .github/workflows/test.yml
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Guards against schema-bearing aws-sdk-go-v2 releases (aws/aws-sdk-go-v2#3601): builds the
  # release binary, fails above 36 MB or if `awtest -version` uses more than 40 MB RSS.
  size-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Binary size and startup RSS
        env:
          AWTEST_SIZE_GUARD: "1"
        run: go test -count=1 -v ./internal/sizeguard/

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Scans with the project's Go toolchain so stdlib findings match shipped binaries.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
