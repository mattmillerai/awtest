# .github/workflows/sync-public.yml
# Syncs clean code (without BMAD/agent artifacts) to the public repo on release tags.
name: Sync to Public Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only the private repo may run this; a copy of this file in the public repo must be a no-op.
    # Also restrict manual runs to tags or main so a dispatch from a feature branch can't overwrite public master.
    if: >-
      github.repository == 'Miller-Media/awtest-private' &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove private artifacts
        run: |
          set -euo pipefail
          rm -rf _bmad _bmad-output .claude .cursor
          rm -f summary.txt coverage.out awtest
          # Remove this sync workflow (only lives in private repo)
          rm -f .github/workflows/sync-public.yml
          # These workflows/configs only make sense in the private repo: release-please
          # tags releases there, and a dependabot.yml on the public default branch would
          # make Dependabot open PRs against the mirror.
          rm -f .github/workflows/release-please.yml .github/dependabot.yml
          # release-please writes compare links against the private repo; point them at public.
          if [ -f CHANGELOG.md ]; then sed -i 's#Miller-Media/awtest-private#mattmillerai/awtest#g' CHANGELOG.md; fi

      - name: Push to public repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage removals
          git add -A
          git commit -m "Sync from private repo" --allow-empty

          git remote add public "https://x-access-token:${GH_PAT}@github.com/mattmillerai/awtest.git"

          # Push master first so a tag-triggered public release always sees the cleaned code.
          # Force is required because the sync commit above is synthetic, not a fast-forward of public history.
          git push public HEAD:refs/heads/master --force

          # Only push the single triggering tag, pointed at the cleaned commit, not the whole private tag set.
          # (Pushing all private tags previously leaked uncleaned history and re-triggered this workflow from public.)
          if [ "$REF_TYPE" = "tag" ]; then
            git tag -f "$REF_NAME" HEAD
            git push public --force "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          fi
